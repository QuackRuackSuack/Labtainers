# dnsmasq DHCP server -- dhcp-starvation lab
# DHCP only (no DNS); serve the lab LAN on eth0.
port=0
interface=eth0
bind-interfaces
dhcp-authoritative

# Finite address pool -- this is the resource the starvation attack drains.
# Pool size and lease time are tuned later (Day 5-7) and parameterized
# per student (Day 16).  Static container IPs (.2/.3/.5/.10) sit outside it.
dhcp-range=192.168.1.50,192.168.1.99,1h

# Human-readable lease file -- primary evidence for detection and grading
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Log every DHCP transaction to syslog and a file (evidence for the detector)
log-dhcp
log-facility=/var/log/dnsmasq.log
